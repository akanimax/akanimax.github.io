<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Catch-all for any old deep URLs still in search results or inbound links.
       GitHub Pages serves this file with a 404 status, so search engines will
       not pass ranking signals through it - its job is to not dead-end humans.
       The signal-consolidating redirect is index.html. -->
  <meta http-equiv="refresh" content="0; url=https://karnewar-qcom.github.io/">

  <title>Page not found - moved to karnewar-qcom.github.io</title>
  <meta name="robots" content="noindex">

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      text-align: center;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      max-width: 34rem;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 1rem;
      letter-spacing: -0.01em;
    }
    p {
      color: #475569;
      margin: 0 0 1.5rem;
    }
    a.go {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.7rem 1.5rem;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    a.go:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>This site has moved</h1>
    <p>
      Animesh Karnewar's homepage now lives at
      <strong>karnewar-qcom.github.io</strong>.
    </p>
    <p>
      <a class="go" href="https://karnewar-qcom.github.io/">Go to the new page</a>
    </p>
  </div>
  <script>
    location.replace('https://karnewar-qcom.github.io/');
  </script>
</body>
</html>
